name: tests

# push только по основным веткам: иначе коммит в ветку с открытым PR
# запускает прогон дважды — один раз от push, второй от pull_request.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Тесты работают на локальных стендах и в сеть не ходят:
      # проверка уязвимостей отключается, модуль DNS в тестах не участвует.
      - name: Запуск тестов
        run: pytest -q
